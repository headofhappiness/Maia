<script type="text/babel">
const { useState, useRef, useEffect } = React;

const SYSTEM_PROMPT = `Du är Maia – en AI-coach för Head of Happiness, ett evidensbaserat välmåendeprogram skapat av Lisa Jonsson, akademiskt utbildad inom hälsopromotion. Du svarar på det språk användaren skriver på – svenska eller engelska. Du är varm, direkt, uppmuntrande och konkret. Använd ALDRIG markdown som **fet text**, *kursiv*, # rubriker eller - listor. Skriv alltid i ren löptext och använd emojis för betoning.

DITT UPPDRAG: Hjälp användaren att bli chef över sitt eget välmående. Lyssna alltid först och ställ EN fråga i taget.

SÄKERHETSREGLER:
- Vid lindrig till måttlig depression är rörelse likvärdigt med samtalsterapi och medicin. (Källa: FYSS 2021)
- Vid svår depression är rörelse ett komplement till professionell behandling, aldrig ersättning.
- Äter någon antidepressiv medicin ska de ALDRIG ändra utan att konsultera läkare.
- Vid kris: 1177, Mind Självmordslinjen 90101, eller akuten.

TON: Stress är vanligt och mänskligt. Undvik tunga uttryck som "Oj, det låter tungt". Säg hellre "Det är väldigt vanligt" eller "Många känner så". SAM-axeln = kroppens brandlarm. HPA-axeln = en arbetsmyra som jobbar i bakgrunden.

UNDERVISNINGSSTIL: Använd metaforer och liknelser. Referera till vad man faktiskt känner i kroppen. Ge vardagsexempel. Förklara varför det spelar roll. Avsluta med en fråga kopplad till personens situation.

LISAS BAKGRUND: Lisa fick panikattacker under sina studier. Läkarna sa "inget är fel" men hon visste att det inte stämde. När hon förstod stressfysiologin klarnade allt.

LEDARE:
Ola Schenström: Läkare och specialist i allmänmedicin med 30+ års erfarenhet.
Sofie J: Mediterar för att hjälpa sig själv att lägga ner världen en stund. Varm och tillgänglig.
Maria Estling Vannestål: Hoppade av forskarkarriären. Utbildad i ACT, mindfulness och Interactive Guided Meditation.
Ottilia Bergström: Yoga- och meditationslärare, kortare meditationer för medvetenhet i vardagen.
Karin Malmström: Mindfulness-instruktör för hållbara prestationer.
Jakob Ahl: Andning och meditation för att komma närmare nuet.
Psykolog Sofia Viotti: Psykolog och lärare i självmedkänsla.
Daniel Ek (Tid att leva): Leg. psykolog, föreläsare i ACT.
Chibs Okereke: Meditationsinstruktör, masterexamen i organisationspsykologi (engelska).
Dr Diana Hill: Klinisk psykolog, specialist på ACT (engelska).

NÄR DU TIPSAR OM ÖVNINGAR: Övningarna kommer från InsightTimer med deras godkännande. Nästan alla 1–10 min, mestadels svenska. Ingen app behövs – klicka länken, tryck mitt på bilden, fortsätt i browsern.

H�LL DIG TILL PROGRAMMET: Lägg ALDRIG till egna påståenden. Gör ALDRIG jämförelser med läkemedel. Om något faller utanför: "Det här faller tyvärr utanför Head of Happiness-programmet men kontakta gärna Lisa Jonsson, lisa@headofhappiness.se"

PROGRAM – 7 VERKTYG: Stress & återhämtning, Rörelse, Sömn, Skärm & sociala medier, Mentala verktyg (medveten närvaro, distans till tankar, acceptans, tacksamhet, självmedkänsla), Relationer, Värderingar.

STRESS: SAM-axeln (snabb, adrenalin, minuter) och HPA-axeln (långsam, kortisol, 60-90 min). Karaseks modell: Krav, Kontroll, Stöd. Återhämtning: byt aktivitet, natur, djupandning, sjung, musik, fokusträning.
RÖRELSE: 150-300 min/vecka måttlig eller 75-150 min hög intensitet (löpning, cykling, aerobics, fotboll, tennis). All rörelse räknas. Hög intensitet = anstränger sig mer, kan bara säga några ord.
SÖMN: 8 tips – sovtider, dagsljus, rörelse, socialt, sovrum, ingen teknik, koffein från lunch, hantera tankar.
SKÄRM: 30 min/dag i 3 veckor ger minskad stress. Dopaminrushar avtrupperar receptorer.
MENTALA VERKTYG: Medveten närvaro (andetaget). Distans till tankar (jag har en tanke om / jag kan ha fel / är den hjälpsam?). Acceptans (sluta kriga mot det som redan är). Tacksamhet (3 saker per dag). Självmedkänsla – Neff (medvetenhet / normalisering / vänlighet mot sig själv).
RELATIONER: EASE – Extend, Action plan, Selection, Expect the best.
VÄRDERINGAR: Livserfarenheter, vad ger glädje, vad upprör dig, visualisera ideala livet.

NÄR DU FÅR KARTLÄGGNINGSRESULTAT: Ge en varm, personlig återkoppling. Lyft fram de 2-3 lägst skattade områdena och föreslå var man kan börja. Vid låg WHO-5 (under 13p) eller hög KEDS (19+): uppmana varsamt att kontakta vårdcentral. Avsluta alltid med en öppen fråga.

COACHING: Lyssna först. EN fråga i taget. Bekräfta och normalisera – stress är vanligt och mänskligt. Hänvisa till professionell hjälp vid allvarliga symtom.`;

const WHO5_Q = [

const WHO5_L = ["0\nAldrig","1\nIbland","2\nMindre än\nhälften","3\nMer än\nhälften","4\nFör det\nmesta","5\nHela\ntiden"];

const KEDS_Q = [
  { title: "Koncentrationsförmåga", desc: "Hur fungerar du vid sysslor som kräver koncentration, t.ex. läsning eller samtal?", opts: { 0:"Jag har inte svårt att koncentrera mig utan läser och för samtal som vanligt.", 2:"Jag har ibland svårt att hålla tankarna samlade på sådant som normalt fångar min uppmärksamhet.", 4:"Jag har ofta svårt att koncentrera mig.", 6:"Jag kan överhuvudtaget inte koncentrera mig på någonting." }},

  { title: "Kroppslig uttröttbarhet", desc: "Känner du dig mer fysiskt trött än vanligt?", opts: { 0:"Jag känner mig som vanligt och utför fysiska aktiviteter som vanligt.", 2:"Jag känner att fysiska ansträngningar är mer tröttande än normalt men rör mig ändå som vanligt.", 4:"Jag har svårt att orka med kroppsansträngning.", 6:"Jag känner mig mycket svag och orkar inte ens röra mig kortare sträckor." }},
  { title: "Uthållighet", desc: "Blir du lättare psykiskt trött än vanligt i vardagen?", opts: { 0:"Jag har lika mycket energi som vanligt.", 2:"Jag klarar vardagliga sysslor men det går åt mer energi och jag behöver ta pauser oftare.", 4:"Jag blir onormalt trött av vardagssysslor.", 6:"Jag orkar inte göra någonting." }},
  { title: "Återhämtning", desc: "Hur väl återhämtar du dig när du blivit uttröttad?", opts: { 0:"Jag behöver inte vila under dagen.", 2:"Jag blir trött under dagen men det räcker med en liten paus.", 4:"Jag blir trött under dagen och behöver långa pauser.", 6:"Det spelar ingen roll hur mycket jag vilar – det är som om jag inte kan ladda om batterierna." }},

function buildSummary(who5, keds, lisa) {
  const w5 = Object.values(who5).reduce((a,b)=>a+b,0);
  const ks = Object.values(keds).reduce((a,b)=>a+b,0);
  const wl = ["Aldrig","Ibland","Lite mindre än hälften","Lite mer än hälften","För det mesta","Hela tiden"];
  let t = "Här är resultaten från min kartläggning:\n\n";
  if (Object.keys(who5).length > 0) {
    t += `WHO-5 (välmående): ${w5} av 25 poäng\n`;
    WHO5_Q.forEach((q,i)=>{ if(who5[i]!==undefined) t+=`  ${q}: ${who5[i]} (${wl[who5[i]]})\n`; });
    t += "\n";
  }
  if (Object.keys(keds).length > 0) {
    t += `KEDS (utmattningsrisk): ${ks} av 54 poäng\n`;
    KEDS_Q.forEach((q,i)=>{ if(keds[i]!==undefined) t+=`  ${q.title}: ${keds[i]}/6\n`; });
    t += "\n";
  }
  if (Object.keys(lisa).length > 0) {
    t += "Självskattning (1–10):\n";
    LISA_A.forEach((a,i)=>{ if(lisa[i]!==undefined) t+=`  ${a}: ${lisa[i]}/10\n`; });
  }
  t += "\nKan du ge mig en personlig återkoppling och hjälpa mig se var jag kan börja?";
  return t;
}

function MaiaCoach() {
  const [view, setView] = useState("home");
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [showDrawer, setShowDrawer] = useState(false);
  const [openTheme, setOpenTheme] = useState(null);
  const [showInfo, setShowInfo] = useState(false);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); },[messages,loading]);

  async function sendMessage(text) {
    const msg = (text||input).trim();
    if (!msg||loading) return;
    const newMsgs = [...messages,{role:"user",content:msg}];
    setMessages(newMsgs);
    setInput("");
    setLoading(true);
    setView("chat");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:1000,
          system:SYSTEM_PROMPT,
          messages:newMsgs.map(m=>({role:m.role,content:m.content}))
        })
      });
      const data = await res.json();
      const reply = data.content?.[0]?.text||"Något gick fel, försök igen.";
      setMessages(prev=>[...prev,{role:"assistant",content:reply}]);
    } catch {
      setMessages(prev=>[...prev,{role:"assistant",content:"Något gick fel. Försök igen om en stund. 💛"}]);
    } finally {
      setLoading(false);
      setTimeout(()=>inputRef.current?.focus(),100);
    }
  }

  function handleKey(e) { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();} }

  const learnTopics = ["Stress","Återhämtning","Rörelse","Sömn","Skärm & sociala medier","Mentala verktyg","Relationer","Värderingar"];
  const feelingTopics = ["Jag känner mig lite nere/nedstämd 🌧️","Jag känner mig stressad 😓","Jag sover dåligt 😴","Jag fastnar i negativa tankar 🌀","Jag vill ha mer energi ⚡","Jag känner mig lite vilsen 🧭","Jag känner mig ensam 🤍"];

  return (
    <div className="app">
      <ExerciseSidebar />
      <div className="content" style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>

        {/* Header */}
        <div className="header">
          <div className="header-logo">M</div>
          <div>
            <div className="header-title">Maia – AI-coach</div>
            <div className="header-sub">Head of Happiness</div>
          </div>
          <div className="header-actions">
            {view!=="home"&&<button className="header-btn" onClick={()=>setView("home")}>🏠 Start</button>}
            <div className="online-dot" />
          </div>
        </div>

        {/* Banner */}
        <div className="banner">
          AI-coach tränad på Head of Happiness evidensbaserade program – inte en ersättning för professionell vård. 💛 Frågor? <a href="mailto:lisa@headofhappiness.se">lisa@headofhappiness.se</a>
        </div>

        {/* Content */}
        <div className="main">

          {/* HOME */}
          {view==="home"&&(
            <div className="home">
              <div className="home-welcome">
                <div className="home-welcome-title">Hej och varmt välkommen! 🌟</div>
                <div className="home-welcome-text">Jag är Maia – en AI-coach tränad på Head of Happiness evidensbaserade program. Berätta hur du mår så anpassar jag mig efter vad du behöver just idag. Du kan prata med mig på svenska eller engelska. 😊</div>
              </div>

              <div className="section-card light">
                <div className="section-label">💬 HUR MÅR DU IDAG?</div>
                <div className="chips">
                  {feelingTopics.map((s,i)=>(
                    <button key={i} className="chip light" onClick={()=>sendMessage(s)}>{s}</button>
                  ))}
                </div>
              </div>

              <div className="section-card dark">
                <div className="section-label">🎓 JAG VILL LÄRA MIG MER OM...</div>
                <div className="chips">
                  {learnTopics.map((s,i)=>(
                    <button key={i} className="chip dark" onClick={()=>sendMessage(`Berätta mer om ${s.toLowerCase()}`)}>{s}</button>
                  ))}
                </div>
              </div>

              <div className="assessment-card" onClick={()=>setView("assessment")}>
                <div className="assessment-card-title">📋 Gör kartläggningen</div>
                <div className="assessment-card-text">WHO-5, KEDS och en självskattning av programmets olika områden. Tar ca 5–10 min och hjälper Maia att anpassa sig efter just dig. Du kan hoppa över när du vill.</div>
              </div>
            </div>
          )}

          {/* ASSESSMENT */}
          {view==="assessment"&&(
            <Assessment onComplete={s=>sendMessage(s)} onSkip={()=>setView("home")} />
          )}

          {/* CHAT */}
          {view==="chat"&&(
            <div className="chat">
              {messages.map((m,i)=>(
                <div key={i} className={`msg-row${m.role==="user"?" user":""}`}>
                  {m.role==="assistant"&&<div className="msg-avatar">M</div>}
                  <div className={`msg-bubble${m.role==="user"?" user":" ai"}`}>{m.content}</div>
                </div>
              ))}
              {loading&&(
                <div className="msg-row">
                  <div className="msg-avatar">M</div>
                  <div className="typing">
                    {[0,1,2].map(i=><div key={i} className="typing-dot" style={{animationDelay:`${i*0.2}s`}} />)}
                  </div>
                </div>
              )}
              <div ref={bottomRef} />
            </div>
          )}

          {/* Input */}
          {view==="chat"&&(
            <div className="input-bar">
              <div className="input-wrap">
                <textarea ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKey}
                  placeholder="Skriv hur du mår eller ställ en fråga..." disabled={loading} rows={1}
                  onInput={e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,100)+"px";}} />
                <button className="send-btn" onClick={()=>sendMessage()} disabled={loading||!input.trim()}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </button>
              </div>
            </div>
          )}
        </div>

        {/* Bottom nav (mobile only) */}
        <div className="bottom-nav">
          <button className={`nav-btn${view==="home"?" active":""}`} onClick={()=>setView("home")}>
            <span className="nav-btn-icon">🏠</span>Start
          </button>
          <button className={`nav-btn${view==="chat"?" active":""}`} onClick={()=>{ if(messages.length>0)setView("chat"); }}>
            <span className="nav-btn-icon">💬</span>Chat
          </button>
          <button className={`nav-btn${view==="assessment"?" active":""}`} onClick={()=>setView("assessment")}>
            <span className="nav-btn-icon">📋</span>Kartläggning
          </button>
          <button className="nav-btn" onClick={()=>setShowDrawer(true)}>
            <span className="nav-btn-icon">🧘</span>Övningar
          </button>
        </div>
      </div>

      {/* Exercise Drawer (mobile) */}
      {showDrawer&&(
        <>
          <div className="drawer-overlay" onClick={()=>setShowDrawer(false)} />
          <div className="drawer">
            <div className="drawer-handle" />
            <div className="drawer-header">
              <div className="drawer-title">🧘 Övningar</div>
              <div className="drawer-sub">Utvalda från InsightTimer med deras godkännande</div>
              <button className="drawer-info-btn" onClick={()=>setShowInfo(!showInfo)}>{showInfo?"Dölj info ▲":"Varför InsightTimer? ▼"}</button>
              {showInfo&&<div className="drawer-info">InsightTimer är världens mest använda meditationsapp. Vi har handplockat övningar som är enkla för nybörjare, nästan alla 1–10 min och mestadels på svenska. Ingen app behövs – klicka länken, tryck mitt på bilden och fortsätt i webbläsaren. 💛</div>}
            </div>
            <div className="drawer-list">
              {Object.entries(EXERCISES).map(([theme,exs])=>(
                <div key={theme}>
                  <button className="drawer-theme-btn" onClick={()=>setOpenTheme(openTheme===theme?null:theme)}>
                    <span className="drawer-theme-label">{theme}</span>
                    <span className="drawer-theme-arrow">{openTheme===theme?"▲":"▼"}</span>
                  </button>
                  {openTheme===theme&&<div className="drawer-exercises">
                    {exs.map((ex,i)=>(
                      <a key={i} className="exercise-link" href={ex.url} target="_blank" rel="noopener noreferrer">
                        <div className="exercise-name">
                          <span className="exercise-name-text">{ex.lang} {ex.name}</span>
                          <span className="exercise-duration">{ex.dur}</span>
                        </div>
                        {ex.leader&&<div className="exercise-leader">{ex.leader}</div>}
                        {ex.note&&<div className="exercise-note">{ex.note}</div>}
                      </a>
                    ))}
                  </div>}
                </div>
              ))}
            </div>
            <div className="drawer-footer">Ingen app behövs 👆 · Klicka länken → tryck mitt på bilden</div>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(MaiaCoach));
</script>
</body>
</html>
