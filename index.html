PROGRAM – 7 VERKTYG: Stress & återhämtning, Rörelse, Sömn, Skärm & sociala medier, Mentala verktyg (medveten närvaro, distans till tankar, acceptans, tacksamhet, självmedkänsla), Relationer, Värderingar.

STRESS: SAM-axeln (snabb, adrenalin, minuter) och HPA-axeln (långsam, kortisol, 60-90 min). Karaseks modell: Krav, Kontroll, Stöd. Återhämtning: byt aktivitet, natur, djupandning, sjung, musik, fokusträning.
RÖRELSE: 150-300 min/vecka måttlig eller 75-150 min hög intensitet. Hög = löpning, snabbare cykling, aerobics, fotboll, tennis. All rörelse räknas.
SÖMN: 8 tips – sovtider, dagsljus, rörelse, socialt, sovrum, ingen teknik, koffein från lunch, hantera tankar.
SKÄRM: 30 min/dag i 3 veckor ger minskad stress. Dopaminrushar avtrupperar receptorer.
MENTALA VERKTYG: Medveten närvaro (andetaget). Distans till tankar (jag har en tanke om / jag kan ha fel / är den hjälpsam?). Acceptans (sluta kriga mot det som redan är). Tacksamhet (3 saker per dag). Självmedkänsla – Neff (medvetenhet / normalisering / vänlighet mot sig själv).

VÄRDERINGAR: Livserfarenheter, vad ger glädje, vad upprör dig, visualisera ideala livet.

function buildSummary(who5, keds, lisa) {
  const who5Score = Object.values(who5).reduce((a, b) => a + b, 0);
  const kedsScore = Object.values(keds).reduce((a, b) => a + b, 0);
  const who5Labels = ["Aldrig", "Ibland", "Lite mindre än hälften", "Lite mer än hälften", "För det mesta", "Hela tiden"];

  let text = "Här är resultaten från min kartläggning:\n\n";

  if (Object.keys(who5).length > 0) {
    text += `WHO-5 (välmående): ${who5Score} av 25 poäng\n`;
    WHO5.forEach((q, i) => { if (who5[i] !== undefined) text += `  ${q}: ${who5[i]} (${who5Labels[who5[i]]})\n`; });
    text += "\n";
  }

  if (Object.keys(keds).length > 0) {
    text += `KEDS (utmattningsrisk): ${kedsScore} av 54 poäng\n`;
    KEDS.forEach((q, i) => { if (keds[i] !== undefined) text += `  ${q.title}: ${keds[i]}/6\n`; });
    text += "\n";
  }

  if (Object.keys(lisa).length > 0) {
    text += "Självskattning (1–10):\n";
    LISA_AREAS.forEach((area, i) => { if (lisa[i] !== undefined) text += `  ${area}: ${lisa[i]}/10\n`; });
  }

  text += "\nKan du ge mig en personlig återkoppling och hjälpa mig se var jag kan börja?";
  return text;
}

                </button>
              </div>
              <div style={{ textAlign: "center", marginTop: 6, fontSize: 10, color: "#b09880" }}>Enter för att skicka • Shift+Enter för ny rad</div>
            </div>
          )}
        </div>

        {/* Sidebar */}
        <div style={{ width: 250, background: "#1c2b3a", display: "flex", flexDirection: "column", overflow: "hidden", borderLeft: "1px solid #2a3f52" }}>
          <div style={{ padding: "14px 16px 10px", borderBottom: "1px solid #2a3f52", flexShrink: 0 }}>
            <div style={{ color: "#f0e4d4", fontSize: 12, fontWeight: 600, marginBottom: 4 }}>🧘 Övningar</div>
            <div style={{ color: "#6a8a9a", fontSize: 10, lineHeight: 1.4 }}>Utvalda från InsightTimer med deras godkännande</div>
            <button onClick={() => setShowInfo(!showInfo)} style={{ marginTop: 5, background: "transparent", border: "none", color: "#c9856a", fontSize: 10, cursor: "pointer", padding: 0, fontFamily: "inherit", textDecoration: "underline" }}>
              {showInfo ? "Dölj info ▲" : "Varför InsightTimer? ▼"}
            </button>
            {showInfo && (
              <div style={{ marginTop: 8, background: "#2a3f52", borderRadius: 8, padding: "10px 12px", fontSize: 10, color: "#a8c0cc", lineHeight: 1.55 }}>
                InsightTimer är världens mest använda meditationsapp. Vi har handplockat övningar som är enkla för nybörjare, nästan alla 1–10 min långa och mestadels på svenska. Du behöver inte ladda ner appen – klicka länken, tryck mitt på bilden och fortsätt i din webbläsare. 💛
              </div>
            )}
          </div>
          <div style={{ flex: 1, overflowY: "auto" }}>
            {Object.entries(EXERCISES).map(([theme, exercises]) => (
              <div key={theme}>
                <button onClick={() => setOpenTheme(openTheme === theme ? null : theme)}
                  style={{ width: "100%", padding: "10px 16px", background: openTheme === theme ? "#2a3f52" : "transparent", border: "none", borderBottom: "1px solid #243344", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", fontFamily: "inherit" }}
                  onMouseEnter={e => { if (openTheme !== theme) e.currentTarget.style.background = "#243344"; }}
                  onMouseLeave={e => { if (openTheme !== theme) e.currentTarget.style.background = "transparent"; }}>
                  <span style={{ color: "#d4c4b0", fontSize: 12, fontWeight: 600 }}>{THEME_EMOJIS[theme]} {theme}</span>
                  <span style={{ color: "#6a8a9a", fontSize: 10 }}>{openTheme === theme ? "▲" : "▼"}</span>
                </button>
                {openTheme === theme && (
                  <div style={{ background: "#243344", padding: "4px 0" }}>
                    {exercises.map((ex, i) => (
                      <a key={i} href={ex.url} target="_blank" rel="noopener noreferrer"
                        style={{ display: "block", padding: "8px 16px", textDecoration: "none", borderBottom: "1px solid #1c2b3a" }}
                        onMouseEnter={e => e.currentTarget.style.background = "#2a3f52"}
                        onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 6 }}>
                          <span style={{ color: "#d4c4b0", fontSize: 11, lineHeight: 1.4, flex: 1 }}>{ex.lang} {ex.name}</span>
                          <span style={{ color: "#c9856a", fontSize: 10, flexShrink: 0 }}>{ex.duration}</span>
                        </div>
                        {ex.leader && <div style={{ color: "#6a8a9a", fontSize: 10, marginTop: 2 }}>{ex.leader}</div>}
                        {ex.note && <div style={{ color: "#8a7060", fontSize: 9, marginTop: 1, fontStyle: "italic" }}>{ex.note}</div>}
                      </a>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
          <div style={{ padding: "10px 16px", borderTop: "1px solid #2a3f52", flexShrink: 0, textAlign: "center" }}>
            <div style={{ color: "#6a8a9a", fontSize: 9, lineHeight: 1.5 }}>Ingen app behövs 👆<br />Klicka länken → tryck mitt på bilden</div>
          </div>
        </div>
      </div>

      <style>{`
        @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
        textarea::placeholder{color:#c4a88a}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-thumb{background:#2a3f52;border-radius:4px}
      `}</style>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(MaiaCoach));
</script>
</body>
</html>
